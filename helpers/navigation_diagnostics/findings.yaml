  - id: completed_validation_handoff
    observed: User reported coverage_manager death when cancel-pending guard called done() on a consumed None join_future.
    cause: Completed ingress/recovery worker was cleared before consuming its result; validation/readiness failure left the executor in validating phase with stop_state pending. Failure after begin_following changed phase could instead leave busy stuck without a submitted action.
    fix: Completed validation handoff failures finish blocked immediately before any new action is sent; cancel-pending validation treats an already-consumed worker as finished while still waiting for genuinely pending workers or active action results.
    verification: Five new regressions reproduced four identical NoneType crashes and one stuck-busy case before the fix, then all passed. Nineteen focused tests passed in 19.37 s including pending action acceptance, worker cancellation, retained cursor, rear obstacle refusal and real Nav2 backup-to-forward-replan completion.
    safety: No new motion on failed handoff, no automatic recovery after operator cancellation, and no early stop confirmation for active or not-yet-accepted actions. Route and ordered cursor remain retained.
    limits: Live Nav2 was not restarted; the Python fix must be loaded by the user. UI/status snapshot plan is saved separately and not implemented.
  - id: guarded_coverage_recovery
    decision: Treat the 0.15 m corridor as a tracking warning, distinguish ingress from work coverage, and validate actual current footprint separately from native predicted-control collision checking.
    authorization: User explicitly permitted short reverse only as recovery; normal MPPI and work passes stay forward-only.
    recovery: After confirmed FollowPath abort, permit at most two standard Nav2 BackUp maneuvers of 0.15 m at 0.05 m/s, with fresh inputs and checked rear swept space, then validate and replan forward ingress to retained remaining poses.
    safety: Operator cancel, stale TF/scan/map, actual-footprint collision, new rear obstacle and exhausted recovery budget are never bypassed. No forced positive speed, blind reverse or unconfirmed action handoff.
    verification: Unit cases and a real Nav2 BackUp-to-Smac-to-MPPI completion integration pass. Native ordered checker retains progress with 0.30 m warning deviation and refuses immediate closed-loop completion.
    full_suite_tests_passed: 152
    full_suite_duration_s: 565.77
    builds: Production image rebuilt via start_robot.sh and isolated lab rebuilt from that image before the complete suite; running robot services were not restarted.
    limits: User restart and live/hardware recovery rollout still pending; existing offline analyzer rejects multi-path recovery captures and must not be presented as complete recovered mission analysis.
  - id: native_collision_diagnostics
    decision: Report current-versus-predicted pose, step/time, frame, cell/world coordinates and lethal/unknown/out-of-map kind only on rejection; predicates and padding remain unchanged.
    evidence: Focused native tests reject occupied current pose, future occupied/unknown cells and predicted out-of-map footprints with their corresponding classifications.
    capture: 20261006T105219Z-coverage-collision-890d49
    capture_limits: Host wrapper lacked directory write permission; container-side recorder saved bag/samples/events/parameters without run.json. Analyzer rejected the missing manifest; no fabricated provenance added.
    observed: During the bounded recorded simulation attempt the robot advanced 7.48 m, then was stopped by the former corridor gate, not a native collision error; observed scan clearance minimum 0.636 m is not occluded-space safety proof.
  - id: coverage_gradual_ingress
    decision: Reuse one CoverageIngress Hybrid planner with 0.50 m searched turning radius and 2.50 m analytic expansion length for controller-compatible startup and searched transits.
    evidence: Live recording confirmed MPPI commands reached the drive, wheel feedback and odometry moved, but the initial turn went opposite the nominal arc and was canceled by the 0.15 m corridor guard. The recorded-start synthetic near-obstacle regression passes with the gradual searched ingress at 0.192 m/s median turn speed and zero below-deadband wheel intervals.
    safety: Coverage work geometry, Ackermann/controller radius, critic weights, 0.20 m/s speed, 0.25 m body clearance, freshness and progress/corridor gates remain unchanged.
    full_suite_tests_passed: 139
    full_suite_duration_s: 582.48
    rejected: Test-only orientation alignment, soft-cost weight reduction and native densification alone did not resolve the difficult startup; none were applied to the runtime profile. Two different-radius Hybrid plugins were avoided because the pinned search shares static motion tables.
    limits: Awaiting user restart and complete live Gazebo validation; loaded hardware remains unverified.
  - id: coverage_execute_recovery
    decision: Preserve partial mission metadata across Execute revalidation and expose backend can_execute for manual retry after temporary blocks; no automatic movement recovery.
    verification: Focused metadata, stale/valid-preview and cancellation tests pass; ten frontend state-gate checks pass.
    rollout: Code and profile ready; user will restart the stack and perform the live coverage trial. Agent did not restart services for this change.
  - id: coverage_callback_load
    decision: Use latest-only scan/costmap QoS, cache only byte-and-geometry-equivalent costmap validators, and avoid dense canonical route copying on the ROS Execute callback.
    evidence: A separate observer measured scan age 0.02-0.15 s while the busy manager rejected its scan timestamp. Host UDP buffer ceilings were already 64 MiB and sampled logs did not establish transport overflow. Snapshot/cache/copy and unchanged stale/future timestamp limits are covered by focused tests.
    safety: Preserve all freshness and filled-footprint validation; fresh data never triggers automatic motion.
  - id: ordinary_navigation_mppi
    decision: Use a separate VerifiedMPPI DiffDrive FollowPath profile for ordinary navigation; leave coverage geometry, CoverageFollowPath and shared safety/control parameters unchanged.
    source: Independently configured; the historical MPPI profile was explicitly rejected as a tuning baseline.
    parameters: {max_speed_m_s: 0.40, smoother_ceiling_m_s: 0.50, max_yaw_rad_s: 1.0, horizon_s: 3.0, model_dt_s: 0.05, path_align_weight: 6.0, final_yaw_distance_m: 0.25}
    safety: No reverse/lateral motion, filled-footprint post-filter validation enabled, no positive speed floor and no coverage velocity-deadband preference.
    verification: Eleven focused shared-profile and real Nav2 navigation tests pass at the 0.40 m/s target, including at least 0.35 m/s observed cruise, wheel deadband, initial rotation, final yaw, obstacle detour, cancellation and stop checks. Coverage controller/checker and planners/costmaps structurally compared unchanged; only the smoother speed ceiling was subsequently raised.
    rejected: GoalAngle activation at 0.5 m aligned too early and stalled before XY tolerance; 0.25 m handoff passes.
    full_suite_tests_passed: 120
    full_suite_duration_s: 574.84
    deployment: User restarted the simulation with the rebuilt Nav2 image; direct DDS query confirms VerifiedMPPI DiffDrive FollowPath at 0.40 m/s with sequence validation enabled, and unchanged Ackermann CoverageFollowPath at 0.20 m/s.
    limits: Full live navigation trials, loaded motors and Raspberry Pi timing are not established by isolated tests.
  - id: mppi_instance_local_sampling
    decision: Isolate std::mt19937 per MPPI NoiseGenerator, retaining the default algorithm/seed, without changing coverage parameters or acceptance thresholds.
    cause: Both pinned MPPI instances otherwise consume the same xtensor process-wide RNG; a second ordinary MPPI changed the deterministic coverage sample sequence.
    evidence: Before isolation the unchanged coverage finish-speed test repeatedly produced 0.134-0.135 m/s and failed its 0.14 m/s gate; a test-only RPP ordinary instance passed at 0.165 m/s. After native isolation the coverage gate passes at 0.155 m/s and a direct interleaved-generator regression passes.
    rollout: Production and isolated lab images rebuilt; restarted simulation container image matches the new production image identity and the complete 120-test suite passes.
  - id: open_work_segments
    decision: Split rows and boundary geometry into open straight/arc work segments, targeting 6 m maximum length, without waypoint stops or mandatory perimeter closure.
    safety: Occupied and unknown cells remain forbidden; every segment and transit retains filled-footprint and forward-only validation. Resource exhaustion rejects the preview rather than returning truncated success.
    partial_coverage: Retry forward directions and deferred rows, report unconnected segments and omitted length, and retain other reachable work in one continuous FollowPath.
    verification: Focused open-mode, cancellation, resource-limit and exact shared-endpoint tests pass; real Smac preview and representative MPPI motion pass with the existing command and wheel-deadband gates.
