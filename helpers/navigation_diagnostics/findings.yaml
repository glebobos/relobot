  file: ros2_ws/src/nav2/behavior_trees/navigate_to_pose.xml
  source: https://github.com/ros-navigation/navigation2/blob/1.1.20/nav2_bt_navigator/behavior_trees/navigate_w_recovery_and_replanning_only_if_path_becomes_invalid.xml
