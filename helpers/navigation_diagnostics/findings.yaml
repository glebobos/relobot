    terminal_observations: {closest_endpoint_distance_m: 0.5077433312719051, samples_inside_xy_tolerance: 0, measured_angular_velocity_rad_s: 0.9996180059366491}
    action_outcome: NavigateToPose remains EXECUTING in the captured statuses; no recorded SUCCEEDED transition.
    limitation: Different endpoint and initial heading from the first capture; not a controlled A/B comparison. Bag covers less time than the JSON monitor.
