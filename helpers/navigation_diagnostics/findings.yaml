findings:
  - id: completed_validation_handoff
    observed: User reported coverage_manager death when cancel-pending guard called done() on a consumed None join_future.
    cause: Completed ingress/recovery worker was cleared before consuming its result; validation/readiness failure left the executor in validating phase with stop_state pending. Failure after begin_following changed phase could instead leave busy stuck without a submitted action.
    fix: Completed validation handoff failures finish blocked immediately before any new action is sent; cancel-pending validation treats an already-consumed worker as finished while still waiting for genuinely pending workers or active action results.
    verification: Five new regressions reproduced four identical NoneType crashes and one stuck-busy case before the fix, then all passed. Nineteen focused tests passed in 19.37 s including pending action acceptance, worker cancellation, retained cursor, rear obstacle refusal and real Nav2 backup-to-forward-replan completion.
    safety: No new motion on failed handoff, no automatic recovery after operator cancellation, and no early stop confirmation for active or not-yet-accepted actions. Route and ordered cursor remain retained.
    limits: Live Nav2 was not restarted; the Python fix must be loaded by the user. UI/status snapshot plan is saved separately and not implemented.
  - id: guarded_coverage_recovery
    decision: Treat the 0.15 m corridor as a tracking warning, distinguish ingress from work coverage, and validate actual current footprint separately from native predicted-control collision checking.
    authorization: User explicitly permitted short reverse only as recovery; normal MPPI and work passes stay forward-only.
    recovery: After confirmed FollowPath abort, permit at most two standard Nav2 BackUp maneuvers of 0.15 m at 0.05 m/s, with fresh inputs and checked rear swept space, then validate and replan forward ingress to retained remaining poses.
    safety: Operator cancel, stale TF/scan/map, actual-footprint collision, new rear obstacle and exhausted recovery budget are never bypassed. No forced positive speed, blind reverse or unconfirmed action handoff.
