  counts: {monitor_plans: 15, bag_plans: 13, mapped_odometry_messages: 462}
  limitation: The bag starts later than the JSON monitor; global-costmap center costs use the recorded full snapshot, not reconstructed updates.
  endpoint: {x_m: 5.7425360810011625, y_m: -0.9264760222285986, yaw_rad: 1.5707963705062866}
  loop_examples:
    - {bag_plan: 4, direct_distance_m: 0.2828, path_length_m: 3.0259, signed_turn_rad: -6.2832, median_arc_radius_m: 0.5256}
