  - id: obstacle_full_map_preview
    decision: Preserve raw map topology, split obstacle-interrupted rows, and use validated perimeter detours or asynchronous CoverageIngress transitions with exact directed endpoints.
    verification: Focused isolated geometry tests cover a central obstacle and 30x30, 60x10 and 36x36 m fields; a real Smac synthetic full-map obstacle preview passes without publishing motion.
    limits: Live Gazebo obstacle execution and physical trials are not yet established for this generator.
  - id: straight_clearance_not_turn_sweep
    decision: Planner-assisted straight-side margins use lateral body extent and conservative raster/lattice allowance; preserve 0.25 m clearance and larger corner/row-end reservations.
    limits: Nominal uncovered work-strip estimates are not measured mowing coverage; forward-only turns still leave physically constrained areas.
  - id: single_ordered_route
    decision: Keep ingress and coverage in one ordered FollowPath, not waypoint stops.
  - id: exact_ingress_join
    decision: Use validated forward Dubins tails; proximity joins can create backward segments.
  - id: dubins_continuity
    decision: Use DUBIN/DISCONTINUOUS; installed CONTINUOUS produced a sideways join.
  - id: post_filter_constraints
    decision: Reapply constraints after MPPI smoothing and validate the resulting filled footprint sweep.
  - id: directional_headland
    decision: Direction-dependent body margins and rounded perimeter avoid excessive uniform insets.
  - id: ordered_goal_checker
    decision: Require ordered progress so a closed path cannot complete at its shared start/end.
  - id: explicit_ordinary_checker
    decision: Ordinary BTs must specify their original goal checker when multiple checkers are loaded.
  - id: useful_turn_speed
    decision: Judge the slower wheel, not base speed; the 0.18 m/s critic is only a soft preference.
  - id: endpoint_handoff
    rejected: Cutoff 0.15 m stalled at 0.16 m remaining; 0.25 m missed the closed-loop endpoint by 0.06 m.
    accepted: Cutoff 0.20 m retained 0.05 m goal tolerance and passed repeated regressions.
  - id: late_recorder_attachment
    decision: Seed offline ordered tracking once from manager progress, never global nearest-row projection.
  - id: world_selection
    decision: Use garden for live SLAM; empty-world infinite scans produced a zero-sized map.

