  goal_checker_behavior: Humble resets the stateful goal checker on each new controller path; the recorded replans occur approximately every 1.3 s.
  conclusion: Rings originate in global Lattice paths and persist with analytic connections disabled; MPPI-only or analytic-only explanations are insufficient.
  next_manual_probe: {rotation_penalty_before: 5.0, rotation_penalty_after: 1.5, scope: Make pure lattice rotations cheaper without changing MPPI or endpoint tolerances.}
