x-ros-env: &ros-env
  DEV: ${DEV:-false}
  ROS_LOG_LEVEL: ${ROS_LOG_LEVEL:-WARN}
  RCUTILS_DEFAULT_LOGGER_DEFAULT_LEVEL: ${RCUTILS_DEFAULT_LOGGER_DEFAULT_LEVEL:-${ROS_LOG_LEVEL:-WARN}}
  RUST_LOG: ${RUST_LOG:-warn}
  PYTHONUNBUFFERED: 1
  OPENBLAS_NUM_THREADS: 1
  OMP_NUM_THREADS: 2
  RMW_IMPLEMENTATION: rmw_zenoh_cpp
  ZENOH_ROUTER_CHECK_ATTEMPTS: 25
  ZENOH_SHM_ALLOC_SIZE: ${ZENOH_SHM_ALLOC_SIZE:-16777216}
  ZENOH_SHM_MESSAGE_SIZE_THRESHOLD: ${ZENOH_SHM_MESSAGE_SIZE_THRESHOLD:-512}
  ZENOH_CONFIG_OVERRIDE: ${ZENOH_SESSION_CONFIG_OVERRIDE:-transport/shared_memory/enabled=true;transport/shared_memory/mode="lazy";transport/shared_memory/transport_optimization/enabled=true;transport/shared_memory/transport_optimization/pool_size=16777216;transport/shared_memory/transport_optimization/message_size_threshold=512}

services:
  # ==========================================================
  # Core Services (Active in BOTH Hardware and Simulation)
  # ==========================================================
  ros2_zenoh_router:
    image: ${ZENOH_ROUTER_IMAGE:-relobot-zenoh-router:local}
    build:
      context: ..
      dockerfile: ros2_ws/ZenohRouter.dockerfile
    container_name: ros2_zenoh_router
    environment:
      RUST_LOG: ${ZENOH_ROUTER_RUST_LOG:-warn}
      RCUTILS_DEFAULT_LOGGER_DEFAULT_LEVEL: ${RCUTILS_DEFAULT_LOGGER_DEFAULT_LEVEL:-${ROS_LOG_LEVEL:-WARN}}
      ZENOH_SHM_ALLOC_SIZE: ${ZENOH_SHM_ALLOC_SIZE:-16777216}
      ZENOH_SHM_MESSAGE_SIZE_THRESHOLD: ${ZENOH_SHM_MESSAGE_SIZE_THRESHOLD:-512}
    volumes:
      - /tmp:/tmp
      - /dev:/hostdev:ro,rslave
      - ./zenoh_devices.json:/etc/relobot/zenoh_devices.json:ro
      - ./start_zenoh_router.sh:/usr/local/bin/start_zenoh_router.sh:ro
      - ./zenoh_devices.py:/usr/local/bin/zenoh_devices.py:ro
    device_cgroup_rules:
      - "c 166:* rwm"
    cap_add:
      - SYS_NICE
    network_mode: host
    ipc: host
    pid: host
    restart: unless-stopped

  ros2_frontend:
    image: nginx:alpine
    container_name: ros2_frontend
    environment:
      DOMAIN_NAME: ${DOMAIN_NAME:-localhost}
      NGINX_ENVSUBST_FILTER: DOMAIN_NAME
    volumes:
      - ./src/web_server/frontend:/usr/share/nginx/html
      - ./src/web_server/frontend/${NGINX_TEMPLATE:-nginx.sim.conf.template}:/etc/nginx/templates/default.conf.template:ro
      - ./src/web_server/certs:/etc/nginx/certs:ro
    network_mode: host
    restart: unless-stopped

  ros2_rosbridge:
    build:
      context: .
      dockerfile: Rosbridge.dockerfile
    container_name: ros2_rosbridge
    ipc: host
    pid: host
    cap_add:
      - SYS_NICE
    volumes:
      - .:/ros2_ws/
      - /tmp:/tmp
      - cargo_registry:/root/.cargo/registry
      - cargo_git:/root/.cargo/git
    environment:
      <<: *ros-env
      PYTHONDONTWRITEBYTECODE: 1
    network_mode: host
    restart: unless-stopped

  ros2_nav2:
    build:
      context: .
      dockerfile: nav2.dockerfile
    container_name: ros2_nav2
    ipc: host
    pid: host
    volumes:
      - .:/ros2_ws/
      - /tmp:/tmp
    devices:
      - /dev/:/dev/
    environment:
      <<: *ros-env
      USE_SIM_TIME: ${USE_SIM_TIME:-false}
    network_mode: host
    privileged: true
    restart: unless-stopped

  ros2_voice_chat:
    build:
      context: .
      dockerfile: VoiceChat.dockerfile
    container_name: ros2_voice_chat
    ipc: host
    pid: host
    volumes:
      - .:/ros2_ws/
      - ..:/relobot
      - ../.agents:/ros2_ws/.agents:ro
      - ${HOME}/.gemini:/root/.gemini
      - ${HOME}/.local/bin:/host_local_bin:ro
      - /usr/local/bin:/host_usr_local_bin:ro
      - /snap/bin:/host_snap_bin:ro
      - /run/user/1000/pulse:/run/user/1000/pulse
      - /tmp:/tmp
      - /var/run/docker.sock:/var/run/docker.sock
      - /etc/ssl/certs:/etc/ssl/certs:ro
      - ${HOME}/.cache/uv:/root/.cache/uv
    devices:
      - /dev/snd:/dev/snd
    environment:
      <<: *ros-env
      PATH: /host_local_bin:/host_snap_bin:/host_usr_local_bin:/usr/local/bin:/usr/bin:/bin
      HOME: /root
      PULSE_SERVER: unix:/run/user/1000/pulse/native
      RELOBOT_HOST_DIR: ${RELOBOT_HOST_DIR:-}
      RELOBOT_WORKSPACE: ${RELOBOT_WORKSPACE:-/relobot}
      AGY_MODEL: ${AGY_MODEL:-gemini-3.8-flash-low}
      AGY_EFFORT: ${AGY_EFFORT:-low}
    working_dir: /relobot
    network_mode: host
    privileged: true
    restart: unless-stopped

  # ==========================================================
  # Physical Hardware Services (Profile: "hardware")
  # ==========================================================
  ros2_lidar:
    profiles: ["hardware"]
    build:
      context: .
      dockerfile: lidar.dockerfile
    container_name: ros2_lidar
    volumes:
      - .:/ros2_ws/
      - /tmp:/tmp
    devices:
      - /dev/:/dev/
    environment:
      <<: *ros-env
    network_mode: host
    ipc: host
    pid: host
    privileged: true
    restart: unless-stopped

  ros2_diff_robot:
    profiles: ["hardware"]
    build:
      context: .
      dockerfile: DiffDriveHardware.dockerfile
    container_name: ros2_diff_robot
    volumes:
      - .:/ros2_ws/
      - ../helpers:/ros2_ws/helpers
      - /dev/serial/by-id:/dev/serial/by-id:ro
      - /tmp:/tmp
    devices:
      - /dev/:/dev/
    environment:
      <<: *ros-env
    depends_on:
      ros2_zenoh_router:
        condition: service_started
    network_mode: host
    ipc: host
    pid: host
    privileged: true
    restart: unless-stopped

  ros2_camera_rp:
    profiles: ["hardware"]
    build:
      context: .
      dockerfile: CameraRp.dockerfile
    container_name: ros2_camera_rp
    volumes:
      - .:/ros2_ws/
      - /var/run/dbus/system_bus_socket:/var/run/dbus/system_bus_socket
      - /tmp:/tmp
    devices:
      - /dev/:/dev/
    environment:
      <<: *ros-env
      LIBCAMERA_LOG_LEVELS: ${LIBCAMERA_LOG_LEVELS:-*:WARN}
    network_mode: host
    ipc: host
    pid: host
    privileged: true
    restart: unless-stopped

  # ==========================================================
  # Gazebo Simulation Services (Profile: "sim")
  # ==========================================================
  ros2_gazebo_sim:
    profiles: ["sim"]
    build:
      context: .
      dockerfile: GazeboSim.dockerfile
    container_name: ros2_gazebo_sim
    volumes:
      - .:/ros2_ws/
      - /tmp:/tmp
    environment:
      <<: *ros-env
      SIM_WORLD: ${SIM_WORLD:-garden_world.sdf}
      SIM_GUI: ${SIM_GUI:-true}
      SIM_KNIVES_MOCK: ${SIM_KNIVES_MOCK:-true}
      DISPLAY: ${DISPLAY:-:0}
      QT_X11_NO_MITSHM: 1
    network_mode: host
    ipc: host
    pid: host
    privileged: true
    restart: unless-stopped

  # ==========================================================
  # Optional Tools / Production Addons
  # ==========================================================
  ros2_certbot:
    profiles: ["hardware", "certbot"]
    image: certbot/dns-route53
    volumes:
      - ./src/web_server/certs:/etc/letsencrypt
      - ./src/web_server/scripts:/scripts:ro
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-us-east-1}
      HOSTED_ZONE_ID: ${HOSTED_ZONE_ID}
      DOMAIN_NAME: ${DOMAIN_NAME}
    entrypoint: /bin/sh /scripts/certbot_entrypoint.sh
    network_mode: host
    restart: "no"

volumes:
  cargo_registry:
  cargo_git:
