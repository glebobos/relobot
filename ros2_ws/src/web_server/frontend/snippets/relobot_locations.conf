# ==========================================================================
# ReloBot Nginx Locations Configuration (Shared DRY Snippet)
# Included by both HTTP (80) and HTTPS (443) server blocks
# ==========================================================================

# Web Application Root & Cache Directives
location / {
    root /usr/share/nginx/html;
    index index.html;

    # Never cache JS/HTML so stale control code can't persist in the browser
    add_header Cache-Control "no-store, no-cache, must-revalidate";
    expires -1;
}

# Stable asset filenames are edited in place during development. Revalidate
# them on refresh so Nginx can return 304 without serving stale content.
location ~* \.(?:glb|gltf|png|jpg|jpeg|gif|ico|svg|woff2?|eot|ttf|otf)$ {
    root /usr/share/nginx/html;
    add_header Cache-Control "no-cache, must-revalidate";
    access_log off;
}

# WebSocket Proxy for Rosbridge
location /rosbridge/ {
    proxy_pass http://127.0.0.1:9090/;
    proxy_http_version 1.1;
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_cache off;
    tcp_nodelay on;
    tcp_nopush off;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_read_timeout 86400s;
    proxy_send_timeout 86400s;
}

# High-speed Binary Map WebSocket Proxy
location /map-ws/ {
    proxy_pass http://127.0.0.1:9090/map-ws/;
    proxy_http_version 1.1;
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_cache off;
    tcp_nodelay on;
    tcp_nopush off;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_read_timeout 86400s;
    proxy_send_timeout 86400s;
}

# Camera Stream Proxy (MJPEG real-time low-latency streaming)
location /camera-stream/ {
    proxy_pass http://127.0.0.1:8080/;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_buffering off;
    proxy_cache off;
    proxy_max_temp_file_size 0;
    chunked_transfer_encoding off;
    tcp_nodelay on;
    tcp_nopush off;
    proxy_read_timeout 86400;
    proxy_send_timeout 86400;
}

# Voice Chatbot & AGY WebSocket Proxy
location /chat-ws/ {
    proxy_pass http://127.0.0.1:8765/;
    proxy_http_version 1.1;
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_cache off;
    tcp_nodelay on;
    tcp_nopush off;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_read_timeout 86400s;
    proxy_send_timeout 86400s;
}

# AGY Interactive Web Terminal (ttyd PTY) - Real-time zero-buffering WebSocket
location ^~ /agy-terminal/ {
    proxy_pass http://127.0.0.1:7681;
    proxy_http_version 1.1;
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_cache off;
    tcp_nodelay on;
    tcp_nopush off;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 86400s;
    proxy_send_timeout 86400s;
}

location = /agy-terminal {
    return 301 /agy-terminal/;
}
