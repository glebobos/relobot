controller_manager:
  ros__parameters:
    update_rate: 30  # Hz
    use_sim_time: false
    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster
    diff_drive_controller:
      type: diff_drive_controller/DiffDriveController

diff_drive_controller:
  ros__parameters:
    left_wheel_names: ["left_wheel_joint"]
    right_wheel_names: ["right_wheel_joint"]

    wheel_separation: 0.295
    wheel_radius: 0.0937

    enable_odom_tf: false
    # odom_frame_id: "odom"
    # base_frame_id: "base_link"

    cmd_vel_timeout: 0.0
    pose_covariance_diagonal: [0.2, 0.2, 9999.0, 9999.0, 9999.0, 0.2]
    twist_covariance_diagonal: [0.2, 0.2, 9999.0, 9999.0, 9999.0, 0.2]
    # Velocity and acceleration limits
    linear:
      x:
        max_velocity: 0.5 # m/s
        min_velocity: -0.5
        max_acceleration: 1.5 # m/s^2
        max_deceleration: -1.5
        max_acceleration_reverse: -1.5
        max_deceleration_reverse: 1.5
    angular:
      z:
        max_velocity: 1.5 # rad/s
        min_velocity: -1.5
        max_acceleration: 4.5 # rad/s^2
        max_deceleration: -4.5
        max_acceleration_reverse: -4.5
        max_deceleration_reverse: 4.5