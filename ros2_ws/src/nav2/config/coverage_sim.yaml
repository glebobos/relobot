controller_server:
  ros__parameters:
    controller_frequency: 20.0
    failure_tolerance: 0.0
    controller_plugins: [FollowPath, CoverageFollowPath]
    goal_checker_plugins: [goal_checker, coverage_goal_checker]
    FollowPath:
      plugin: nav2_mppi_controller::MPPIController
      motion_model: DiffDrive
      time_steps: 60
      model_dt: 0.05
      batch_size: 300
      iteration_count: 1
      vx_max: 0.40
      vx_min: 0.0
      vy_max: 0.0
      wz_max: 1.0
      vx_std: 0.20
      vy_std: 0.0
      wz_std: 0.40
      temperature: 0.3
      gamma: 0.015
      prune_distance: 1.6
      max_robot_pose_search_dist: 2.5
      transform_tolerance: 0.2
      visualize: false
      reset_period: 1.0
      retry_attempt_limit: 1
      critics: [ConstraintCritic, CostCritic, GoalCritic, GoalAngleCritic, PathAlignCritic, PathFollowCritic, PathAngleCritic, PreferForwardCritic]
      ConstraintCritic:
        enabled: true
        cost_power: 1
        cost_weight: 4.0
      CostCritic:
        enabled: true
        cost_power: 1
        cost_weight: 3.81
        consider_footprint: true
        critical_cost: 300.0
        collision_cost: 1000000.0
        near_goal_distance: 0.0
      GoalCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        threshold_to_consider: 1.0
      GoalAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 3.0
        threshold_to_consider: 0.25
      PathAlignCritic:
        enabled: true
        cost_power: 1
        cost_weight: 6.0
        max_path_occupancy_ratio: 0.05
        trajectory_point_step: 3
        threshold_to_consider: 0.5
        offset_from_furthest: 8
        use_path_orientations: false
      PathFollowCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        offset_from_furthest: 6
        threshold_to_consider: 0.5
      PathAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 2.0
        offset_from_furthest: 4
        threshold_to_consider: 0.25
        max_angle_to_furthest: 1.0
        forward_preference: true
      PreferForwardCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        threshold_to_consider: 0.5
    coverage_goal_checker:
      plugin: relobot::OrderedGoalChecker
      stateful: true
      xy_goal_tolerance: 0.05
      yaw_goal_tolerance: 3.141592653589793
    CoverageFollowPath:
      plugin: nav2_mppi_controller::MPPIController
      motion_model: Ackermann
      AckermannConstraints:
        min_turning_r: 0.20
      time_steps: 60
      model_dt: 0.05
      batch_size: 1000
      iteration_count: 1
      vx_max: 0.20
      vx_min: 0.0
      vy_max: 0.0
      wz_max: 1.0
      vx_std: 0.10
      vy_std: 0.10
      wz_std: 0.30
      temperature: 0.3
      gamma: 0.015
      prune_distance: 1.2
      max_robot_pose_search_dist: 0.6
      transform_tolerance: 0.2
      visualize: false
      reset_period: 1.0
      retry_attempt_limit: 1
      critics: [ConstraintCritic, CostCritic, GoalCritic, GoalAngleCritic, PathAlignCritic, PathFollowCritic, PathAngleCritic, PreferForwardCritic, VelocityDeadbandCritic]
      VelocityDeadbandCritic:
        enabled: true
        cost_power: 1
        cost_weight: 35.0
        deadband_velocities: [0.18, 0.0, 0.0]
      ConstraintCritic:
        enabled: true
        cost_power: 1
        cost_weight: 4.0
      CostCritic:
        enabled: true
        cost_power: 1
        cost_weight: 3.81
        consider_footprint: true
        critical_cost: 300.0
        collision_cost: 1000000.0
        near_goal_distance: 0.0
      GoalCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        threshold_to_consider: 0.10
      GoalAngleCritic:
        enabled: false
      PathAlignCritic:
        enabled: true
        cost_power: 1
        cost_weight: 20.0
        max_path_occupancy_ratio: 0.05
        trajectory_point_step: 2
        threshold_to_consider: 0.20
        offset_from_furthest: 6
        use_path_orientations: false
      PathFollowCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        offset_from_furthest: 4
        threshold_to_consider: 0.10
      PathAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 2.0
        offset_from_furthest: 4
        threshold_to_consider: 0.15
        max_angle_to_furthest: 0.8
        forward_preference: true
      PreferForwardCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        threshold_to_consider: 0.15

bt_navigator:
  ros__parameters:
    default_nav_to_pose_bt_xml: /ros2_ws/install/nav2/share/nav2/behavior_trees/navigate_to_pose.xml
    default_nav_through_poses_bt_xml: /ros2_ws/install/nav2/share/nav2/behavior_trees/navigate_through_poses.xml

planner_server:
  ros__parameters:
    planner_plugins: [GridBased]

global_costmap:
  global_costmap:
    ros__parameters:
      footprint_padding: 0.25
      inflation_layer:
        inflation_radius: 0.95

local_costmap:
  local_costmap:
    ros__parameters:
      footprint_padding: 0.25
      update_frequency: 10.0
      publish_frequency: 5.0
      always_send_full_costmap: true
      plugins: [static_layer, obstacle_layer, inflation_layer]
      static_layer:
        plugin: nav2_costmap_2d::StaticLayer
        map_topic: /map
        subscribe_to_updates: true
        map_subscribe_transient_local: true
      inflation_layer:
        inflation_radius: 0.95

velocity_smoother:
  ros__parameters:
    smoothing_frequency: 20.0
    scale_velocities: true
    max_velocity: [0.50, 0.0, 1.5]
    min_velocity: [-0.20, 0.0, -1.5]
    max_accel: [0.4, 0.0, 2.0]
    max_decel: [-0.8, 0.0, -3.0]
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 0.5

coverage_server:
  ros__parameters:
    min_turning_radius: 0.25
    default_headland_width: 1.5
    default_route_type: SNAKE
    default_path_type: DUBIN
    default_path_continuity_type: DISCONTINUOUS
    default_turn_point_distance: 0.03

coverage_manager:
  ros__parameters:
    layout_mode: directional
    swath_spacing: 0.24
    open_segments: true
    work_segment_length_m: 6.0
    motion_odom_topic: /odometry/filtered
    recovery_enabled: true
    recovery_backup_enabled: false
    recovery_max_attempts: 2
    recovery_backup_distance: 0.15
    recovery_backup_speed: 0.05
    planning_timeout_sec: 120.0
    max_path_points: 250000
    headland_width: 1.5
    min_turning_radius: 0.20
    clearance: 0.25
    path_type: DUBIN
    path_continuity_type: DISCONTINUOUS
    turn_point_distance: 0.03
    map_morph_close_radius: 0